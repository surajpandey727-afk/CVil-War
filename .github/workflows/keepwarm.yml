name: Keep-warm & uptime

# Why this exists: the production database lives on Supabase's free tier, which pauses a
# project after ~7 days with no connections and tears down its host — which is exactly how the
# app went dark for a fortnight with nothing watching it (see docs/ARCHITECTURE_AUDIT.md §2).
#
# This workflow does two jobs at once, for free, with nothing to run or pay for:
#   1. Keep-warm — a scheduled request every ~10 minutes keeps a connection flowing, so the
#      free tier never considers the project idle. The DB-touching health probe is what counts;
#      a static-page ping would not keep the database warm.
#   2. Uptime — if /health does not return 200 with "db": true, the job fails and GitHub emails
#      the repo owner. That is the alert whose absence let §2 go unnoticed.
#
# It polls the API's /health, which already returns 503 with {"db": false} when the database is
# unreachable — the endpoint was built for exactly this and nothing was reading it.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub's minimum is 5)
  workflow_dispatch: {} # allow a manual run from the Actions tab

# Never pile up: if a run is somehow still going, skip rather than stack.
concurrency:
  group: keepwarm
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health (keep-warm + uptime)
        env:
          HEALTH_URL: https://cvil-war-api.vercel.app/health
        # Up to 3 attempts, 50s each, 20s apart. The API is a ~280 MB Python function; a cold
        # start can exceed the old single 25s attempt, which failed the job (and emailed the
        # owner) while the site was actually healthy. Every attempt logs its HTTP status and
        # timing so a real outage is distinguishable from a slow cold start.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            body="$(curl -sS --max-time 50 -w '\n%{http_code} %{time_total}s' "$HEALTH_URL" || true)"
            meta="$(printf '%s' "$body" | tail -n1)"
            json="$(printf '%s' "$body" | sed '$d')"
            echo "attempt $attempt: HTTP/time $meta"
            echo "health: $json"
            if printf '%s' "$json" | grep -Eq '"db": ?true'; then
              if printf '%s' "$json" | grep -Eq '"storage": ?\{"ok": ?false'; then
                echo "::error::Database is up but file storage is unreachable — résumé uploads will fail. Check SUPABASE_URL / SUPABASE_SECRET_KEY / the storage bucket."
                exit 1
              fi
              echo "OK — database reachable."
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::Health check failed 3 times — database not reachable (or the API is down). Check Vercel logs and the Supabase project."
          exit 1
