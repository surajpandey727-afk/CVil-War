[project]
name = "autoapply-backend"
version = "2.0.0"
description = "AutoApply AI — Smart Job Application Assistant Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # Browser automation
    "browser-use>=0.1.40",
    "playwright>=1.44.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",

    # LLM abstraction layer
    # Upper bound is load-bearing, not cosmetic: with an open `>=1.40.0` range pip backtracks
    # through litellm releases while resolving langchain-* and reaches 1.93.0, which ships only
    # an sdist whose metadata build needs a Rust toolchain — so `pip install -e ".[dev]"` fails
    # outright on a clean machine without cargo.
    "litellm>=1.96,<2",
    # Not imported directly; litellm loads it for the "portkey" success/failure callback
    # configured in core/llm/client.py::_configure_portkey.
    "portkey-ai>=1.6.0",

    # Document generation
    "weasyprint>=62.0",
    "python-docx>=1.1.0",
    "jinja2>=3.1.0",
    "PyPDF2>=3.0.0",

    # ML / NLP
    # spaCy is the only one of these actually imported (core/ats/nlp.py). It needs the
    # en_core_web_sm model, which pip does not install — see README. Without it the ATS
    # analysers silently degrade to regex, and the PII gate fails closed by design.
    "spacy>=3.7.0",
    # REMOVED (verified never imported anywhere in app/ or tests/):
    #   sentence-transformers, faiss-cpu, scikit-learn, numpy, fuzzywuzzy,
    #   python-Levenshtein, python-dateutil
    # sentence-transformers alone pulls PyTorch; together they accounted for the bulk of a
    # ~3.7 GB wheel download for code that never runs. ARCHITECTURE.md described a FAISS
    # vector store at core/matching/vector_store.py — that module does not exist. When
    # semantic matching is genuinely added it should use pgvector (see docs/PHASE0_AUDIT.md
    # §5.4), not a second vector stack.

    # Async I/O
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",

    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",

    # Resilience
    "tenacity>=8.3.0",

    # Job discovery
    "exa-py>=1.1.0",

    # Auth & secrets
    "PyJWT>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "cryptography>=43.0.0",

    # Async job queue
    "arq>=0.26.0",

    # Migrations (enum-aware autogenerate)
    "alembic-postgresql-enum>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "fakeredis[aioredis]>=2.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aioboto3>=13.0.0",
    "moto[s3,server]>=5.0.0",
]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
]
aws = [
    "aioboto3>=13.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-autogenerated revisions follow the tool's own template style.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "ANN401",  # dynamically typed expressions (typing.Any)
    "ANN101",  # deprecated rule: missing type annotation for self
    "ANN102",  # deprecated rule: missing type annotation for cls
    "B008",    # Depends() in function defaults — standard FastAPI pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "SIM117", "E501"]  # relaxed rules for test files

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
