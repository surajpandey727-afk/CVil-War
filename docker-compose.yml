services:
  # One-shot schema migration. The app does NOT create tables at startup — app/main.py
  # states the schema is owned by Alembic — so without this a fresh `docker compose up`
  # booted against an empty database, /health returned 503, and the backend healthcheck
  # never passed. backend and worker both gate on this completing successfully.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: alembic upgrade head
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - cvil-war
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cvil-war
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: arq app.workers.tasks.WorkerSettings
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cvil-war
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cvil-war
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Bound to loopback only, not "6379:6379" — nothing outside this container needs to
    # reach Redis directly; backend/worker talk to it over the internal `cvil-war` network
    # by service name. An unauthenticated Redis published on a public/LAN interface is one
    # of the most commonly scanned-and-compromised misconfigurations on the internet (used
    # for cryptomining/ransomware via CONFIG SET). This still lets a backend/worker running
    # natively on the host (outside Docker) reach it via redis://localhost:6379, same as
    # before, since loopback traffic is exactly what "127.0.0.1:" publishes.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cvil-war
    restart: unless-stopped

volumes:
  redis_data:

networks:
  cvil-war:
    driver: bridge
